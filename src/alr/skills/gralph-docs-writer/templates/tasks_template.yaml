# Template for tasks.yaml. SKILL.md holds the field rules and task-scoping
# guidance; this header covers only how to fill in this file.
#
# - Replace every GENERATE_* token. Copy the task entry once per task.
# - The shared prompt below covers the project, the task-file rule, and the
#   result line contract; put only task-specific content in each task's `prompt`.
# - Leave `state` empty; Gralph reads an empty state as pending.
# - Comments are not passed to the agent, so drop this header from the
#   generated file.
shared:
  prompt: |
    ## Project

    - Context documents: GENERATE_RELEVANT_PROJECT_DOCUMENT_PATHS_OR_NONE
    - Build and test: GENERATE_TOOLCHAIN_BUILD_AND_TEST_COMMANDS
    - Commits: GENERATE_COMMIT_RULES_OR_DO_NOT_COMMIT_IF_AN_ACTION_COMMITS
    - Never edit or commit `tasks.yaml`.

    ## Finish

    The last non-blank line of your output must be this JSON object, on a single
    line, with nothing else on that line:

    {"state": "completed", "error": ""}

    If the task did not succeed, use `"state": "failed"` and a one-line `error`.
  # Actions alr runs itself. after_task runs after every task's session; if any
  # fails, the task fails. Put a commit LAST: alr does not undo earlier actions.
  # alr sets ALR_TASK_ID, ALR_TASK_NAME, ALR_TASK_FILE, and ALR_LOG_DIR; use
  # them in quotes, as "$ALR_TASK_NAME". Keep tasks.yaml and the logs out of a
  # commit. The long :(exclude) form is needed: git ignores the short :! form
  # when the path is absolute, as these two are. The diff --cached test is there
  # because a task that changed nothing has nothing to commit, and without it a
  # clean tree makes the action fail. The run folder (tasks.yaml and logs/) must
  # be inside the git work tree for this action; if it is outside, drop the two
  # :(exclude) entries (plain git add -A), since git cannot see those files.
  # Delete the commit action if alr should not commit. Drop these comments from the generated file.
  after_task:
    - action: GENERATE_BUILD_AND_TEST_COMMAND_OR_DELETE
    - action: >-
        git add -A -- . ":(exclude)$ALR_TASK_FILE" ":(exclude)$ALR_LOG_DIR" &&
        (git diff --cached --quiet || git commit -s -m "$ALR_TASK_NAME")
  # after_run runs once at the end, also when every task was already completed.
  # A failure exits 4 and leaves the tasks completed. Use [] or omit it for none.
  after_run: []
tasks:
  - id: 1
    name: "GENERATE_SHORT_TASK_TITLE"
    state: ""
    prompt: |
      Objective:
      GENERATE_ONE_SENTENCE_DELIVERABLE_AND_PROJECT_CONTEXT

      Scope and files:
      - GENERATE_EXACT_SOURCE_OR_SUPPORTING_PATHS_AND_ALLOWED_CHANGES
      - GENERATE_RELEVANT_DEPENDENCIES_CONSTRAINTS_AND_NON_GOALS

      Steps:
      1. GENERATE_BOUNDED_IMPLEMENTATION_ACTIONS_FOR_THIS_DELIVERABLE
      2. GENERATE_TASK_SPECIFIC_CLEANUP_OR_OMIT_THIS_STEP

      Verification:
      - Working directory: GENERATE_ACTUAL_VERIFICATION_DIRECTORY
      - Project checks: GENERATE_PROJECT_TEST_LINT_AND_BUILD_COMMANDS
      - Task checks: GENERATE_TASK_SPECIFIC_COMMANDS_OR_NONE
      - Expected outcome: GENERATE_OBSERVABLE_SUCCESS_CONDITION

      Completion criteria:
      - GENERATE_CONCRETE_DELIVERED_BEHAVIOR_AND_RELEVANT_ACCEPTANCE_CHECKS
