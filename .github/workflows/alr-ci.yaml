name: Agentic Loop Runner (alr) CI build

# Documentation changes do not need the Docker build. The job is not a
# required status check, so skipping it leaves a docs-only PR mergeable.
on:
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  build:
    name: Docker Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for version metadata

      - name: Run Docker-first build
        run: ./build/build.sh
