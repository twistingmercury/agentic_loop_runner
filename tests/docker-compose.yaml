name: milhouse-e2e

services:
  tests:
    build:
      context: ..
      dockerfile: tests/e2e/Dockerfile
      args:
        # build/build.sh sets this to the wheel it is testing.
        MILHOUSE_WHEEL: ${MILHOUSE_WHEEL:?run build/build.sh, which names the wheel}
    container_name: milhouse-e2e-tests
