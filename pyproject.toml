[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist>=3.8.0",
    "ruff",
    "types-pyyaml>=6.0.12.20261103",
]

[project]
name = "alr"
version = "0.0.1"
description = "A tool for running ralph loops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6",
    "textual>=8.2.8",
]

[project.scripts]
alr = "alr.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[tool.mypy]
# Only the package: the unit tests still have errors of their own, and the e2e
# tests run in their own container with their own dependencies.
files = ["src"]

[tool.ruff]
# The plans under docs/ hold code blocks that ruff would otherwise reformat.
# Claude Code's sandbox masks files under .claude/ with unreadable stand-ins.
extend-exclude = ["docs", ".claude"]

[tool.ruff.lint]
select = ["F", "N"]

[tool.setuptools.package-data]
alr = ["skills/**/*", "defaults/**/*"]
