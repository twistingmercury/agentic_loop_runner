[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project]
name = "alr"
version = "0.0.1"
description = "A tool for running ralph loops"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6",
    "textual>=8.2.8",
]

[project.scripts]
alr = "alr.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[tool.ruff]
# The plans under docs/ hold code blocks that ruff would otherwise reformat.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["F", "N"]

[tool.setuptools.package-data]
alr = ["skills/**/*"]
